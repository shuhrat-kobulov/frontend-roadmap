name: Lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - .markdownlint-cli2.jsonc
      - .github/workflows/lint.yml
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
          # Report only — never rewrite a contributor's content in CI. Rules the
          # repo intentionally violates are switched off in
          # .markdownlint-cli2.jsonc, which the tool discovers automatically.
          fix: false
